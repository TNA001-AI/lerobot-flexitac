[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_policy_tactile"
version = "0.2.0"
description = "Spatial tactile token encoders (TactileCNN / TactileAttentionCNN) and policy plugins for LeRobot"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "LeFlexiTac Authors (Columbia University RoboPIL)" },
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "torch", "numpy"]

[tool.setuptools.packages.find]
include = ["lerobot_policy_tactile*"]
