[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_tactile_flexitac"
version = "0.2.0"
description = "FlexiTac (12x32) tactile sensor plugin for LeRobot"
readme = "README.md"
requires-python = ">=3.11"  # flexitac requires >=3.11
license = "Apache-2.0"
authors = [
    { name = "LeFlexiTac Authors (Columbia University RoboPIL)" },
]
# `lerobot` is intentionally NOT declared so installing never re-resolves an existing robot
# environment (LeRobot / torch / opencv). flexitac only needs unpinned numpy + pyserial.
dependencies = ["flexitac>=0.3.1"]

[project.optional-dependencies]
dev = ["pytest", "opencv-python-headless"]

[tool.setuptools.packages.find]
include = ["lerobot_tactile_flexitac*"]
