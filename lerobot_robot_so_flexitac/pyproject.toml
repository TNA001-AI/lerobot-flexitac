[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_so_flexitac"
version = "0.2.0"
description = "SO-100/101/10X follower robot plugin with lossless float32 FlexiTac tactile state"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "LeFlexiTac Authors (Columbia University RoboPIL)" },
]
# Hard dependency on our own sensor package (imported unconditionally). `lerobot` itself is
# intentionally not declared so installs never re-resolve an existing robot environment.
dependencies = ["lerobot_tactile_flexitac>=0.2.0"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["lerobot_robot_so_flexitac*"]
